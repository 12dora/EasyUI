name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不写 version:action-setup 会读 package.json 的 packageManager 字段,于是 CI 装的
      # 就是本地开发用的那一版 pnpm(而不是 "11" 里最新的任意补丁版),lockfile 不会因为
      # 两边版本漂移而对不上。要升级 pnpm 只改 package.json 一处。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint (code smells ratchet)
        run: pnpm lint
      - name: unit tests
        run: pnpm vitest run
      - name: typecheck
        run: |
          if [ -f tsconfig.json ]; then
            pnpm exec tsc --noEmit
          else
            echo "no tsconfig.json — 本包由宿主编译,跳过 typecheck"
          fi
